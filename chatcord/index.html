async function save(sid,fn){const d=structuredClone(servers[sid]);fn(d);try{await db.doc("servers/"+sid).set(d)}catch(e){note("Couldn't save: "+e.code)}}
async function upd(sid,patch){try{await db.doc("servers/"+sid).update(patch)}catch(e){note("Couldn't save: "+e.code)}}

function render(){renderBar();renderSide();renderMain()}
function renderBar(){
 const mine=Object.entries(servers).filter(([id])=>roleOf(id,me));
 $("servers").innerHTML=mine.map(([id,s])=>`<div class="sv${id==cur?" on":""}" data-a="open" data-s="${esc(id)}" title="${esc(s.name)}">${esc((s.name||"?")[0].toUpperCase())}</div>`).join("")
 +`<div class="sv add" data-a="newServer" title="Make a server">+</div><div class="sv mebtn${view=="profile"?" on":""}" data-a="profile" title="My profile">${me?av(me,{}).replace('data-a="prof"',''):"Me"}</div><div class="sv find${view=="discover"?" on":""}" data-a="discover">Find</div>`;
}
function renderMe(){
 if(!me){$("mecard").innerHTML="";return}const p=profiles[me]||{};
 $("mecard").innerHTML=av(me,{}).replace('data-a="prof"','')+`<span class="dot"></span><div class="who"><b>${esc(dn({},me))}</b><small>${esc(p.status||"Online")}</small></div>`;
}
function renderSide(){
 renderMe();const s=S();
 if(!s||view=="discover"||view=="profile"){$("sideTop").innerHTML=`<div class="brand"><svg viewBox="0 0 64 64" width="28" height="28"><rect width="64" height="64" rx="18" fill="#5865f2"/><path d="M16 18h32a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H32l-8 7v-7h-8a4 4 0 0 1-4-4V22a4 4 0 0 1 4-4z" fill="#fff"/></svg><b>Chatcord</b></div><div class="tip"><b>+ Make</b>Start your own server</div><div class="tip"><b>Find</b>Ask to join one</div>`;return}
 const r=myR(),pend=s.pend||{},reqN=Object.keys(s.reqs||{}).length,pendN=Object.keys(pend).length;
 const alerts=(r>=3?reqN:0)+(r==5?pendN:0);
 $("sideTop").innerHTML=`<h3>${esc(s.name)}</h3><div class="role">You: ${RN[roleOf(cur,me)]}</div>`+
 chans(s).map(([id,c])=>`<div class="ch${id==curCh&&view=="chat"?" on":""}" data-a="chan" data-c="${esc(id)}"><span># ${esc(c.name)}${pend[id]?" (delete?)":""}</span>${r>=4&&!(r==4&&pend[id])?`<button class="x" data-a="delChan" data-c="${esc(id)}" title="Delete chat">×</button>`:""}</div>`).join("")+
 (r>=4?`<button class="side-btn g" data-a="newChan">+ New chat</button>`:"")+
 `<button class="side-btn g" data-a="members">Members${alerts?`<span class="badge">${alerts}</span>`:""}</button>`;
}
async function renderMain(){
 const s=S();$("f").hidden=!(view=="chat"&&s&&curCh);if($("f").hidden)$("gifbox").hidden=true;
 if(view=="profile")return renderProfile();
 if(view=="discover"||!s)return renderDiscover();
 if(view=="members")return renderMembers();
 const c=s.chans?.[curCh];$("head").textContent=c?"# "+c.name:s.name;$("i").placeholder=c?"Message #"+c.name:"Message";
 renderMsgs();
}
function renderDiscover(){
 $("head").textContent="Find servers";
 const list=Object.entries(servers).sort((a,b)=>b[1].t-a[1].t);
 $("body").innerHTML=list.length?list.map(([id,s])=>{
  const mem=roleOf(id,me),req=s.reqs?.[me];
  const hue=[...id].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
  return `<div class="row"><div class="sicon" style="background:linear-gradient(135deg,hsl(${hue} 70% 55%),hsl(${(hue+50)%360} 70% 45%))">${esc((s.name||"?")[0].toUpperCase())}</div><div class="n"><b>${esc(s.name)}</b><br><small>${Object.keys(s.members||{}).length} members</small></div>${
   mem?`<button data-a="open" data-s="${esc(id)}">Open</button>`:req?`<button class="g" disabled>Requested</button>`:`<button data-a="join" data-s="${esc(id)}">Request to join</button>`}</div>`}).join("")
 :`<div class="empty"><svg viewBox="0 0 64 64" width="84" height="84"><rect x="4" y="4" width="56" height="56" rx="18" fill="#5865f2"/><path d="M18 20h28a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H32l-7 6v-6h-7a4 4 0 0 1-4-4V24a4 4 0 0 1 4-4z" fill="#fff"/><circle cx="26" cy="31" r="3" fill="#5865f2"/><circle cx="38" cy="31" r="3" fill="#5865f2"/></svg><div class="big">No servers yet</div><div>Be the first. Make one and you're the owner.</div><button data-a="newServer">+ Make a server</button></div>`;
}
async function renderMembers(){
 const s=S(),r=myR(),mems=Object.entries(s.members||{}).sort((a,b)=>R[b[1]]-R[a[1]]),reqs=Object.keys(s.reqs||{}),pend=Object.entries(s.pend||{});
 $("head").textContent=s.name+" · Members";
 const ps=await names([...mems.map(m=>m[0]),...reqs,...pend.map(p=>p[1])]);
 if(view!="members"||S()!==s)return;
 let h="";
 if(r>=3&&reqs.length)h+=`<h4>Join requests</h4>`+reqs.map(u=>`<div class="row"><div class="n">${esc(nm(ps,u))}</div><button data-a="accept" data-u="${esc(u)}">Accept</button><button class="r" data-a="deny" data-u="${esc(u)}">Deny</button></div>`).join("");
 if(r==5&&pend.length)h+=`<h4>Co-owner wants to delete</h4>`+pend.map(([cid,by])=>`<div class="row"><div class="n">#${esc(s.chans?.[cid]?.name)} <small>by ${esc(nm(ps,by))}</small></div><button class="r" data-a="okDel" data-c="${esc(cid)}">Delete it</button><button class="g" data-a="noDel" data-c="${esc(cid)}">Keep it</button></div>`).join("");
 if(r==4&&pend.length)h+=`<div class="note" style="padding:0">Waiting for the owner to OK ${pend.length} chat delete(s).</div>`;
 h+=`<h4>Members</h4>`+mems.map(([u,role])=>{
  const can=r>=4&&R[role]<r&&u!==me;
  const modCh=role=="mod"?s.chans?.[s.modOf?.[u]]?.name:null;
  let sel="";
  if(can){const opts=[];if(r==5)opts.push(["coowner","Co-owner"]);if(r>=4)opts.push(["admin","Admin"]);
   chans(s).forEach(([cid,c])=>opts.push(["mod:"+cid,"Mod of #"+c.name]));opts.push(["normal","Member"]);
   const curV=role=="mod"?"mod:"+(s.modOf?.[u]||""):role;
   sel=`<select data-u="${esc(u)}">${opts.map(([v,l])=>`<option value="${esc(v)}"${v==curV?" selected":""}>${esc(l)}</option>`).join("")}</select><button class="r" data-a="kick" data-u="${esc(u)}">Kick</button>`}
  return `<div class="row">${av(u,ps,"sm")}<div class="n">${esc(dn(ps,u))}<br><small>${RN[role]||role}${modCh?" of #"+esc(modCh):""}</small></div>${sel}</div>`}).join("");
 h+=`<h4>Server</h4>`+(r==5?`<button class="r" data-a="delServer">Delete server</button>`:`<button class="r" data-a="leave">Leave server</button>`);
 $("body").innerHTML=h;
}
async function renderMsgs(){
 const s=S();if(!s)return;const r=myR(),canMod=r>=3||(roleOf(cur,me)=="mod"&&s.modOf?.[me]==curCh);
 const list=msgs.slice().reverse();
 const ps=await names([...new Set(list.filter(m=>!m.bot).map(m=>m.uid))]);
 if(view!="chat")return;
 const box=$("body"),atBot=box.scrollHeight-box.scrollTop-box.clientHeight<80;
 box.innerHTML=list.length?list.map(m=>{
  const rr=m.bot?null:roleOf(cur,m.uid),p=profiles[m.uid]||{};
  const rx=EM.map((em,i)=>{const us=Object.keys(m.re?.["r"+i]||{}).filter(k=>m.re["r"+i][k]);return us.length?`<button class="chip${us.includes(me)?" on":""}" data-a="react" data-m="${esc(m.id)}" data-e="${i}">${em} ${us.length}</button>`:""}).join("");
  return `<div class="m">${m.bot?`<div class="av" style="background:#d97757">C</div>`:av(m.uid,ps)}<div class="mb"><div>
  <b ${m.bot?'class="bot"':`data-a="prof" data-u="${esc(m.uid)}" style="cursor:pointer;color:${esc(p.color||"#fff")}"`}>${esc(m.bot?"Claude":dn(ps,m.uid))}</b>${m.bot?'<span class="tag">BOT</span>':rr&&rr!="normal"?`<span class="tag">${RN[rr]}</span>`:""}<small>${new Date(m.t).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}</small>${canMod||m.uid===me?`<button class="x" data-a="delMsg" data-m="${esc(m.id)}" title="Delete">×</button>`:""}</div>
  ${m.text?`<div class="tx">${esc(m.text)}</div>`:""}${m.img?`<img class="att" src="${blob(m.img)}" alt="">`:""}${m.gif!=null?gifHtml(+m.gif,1):""}
  <div class="rx">${rx}<span class="rwrap"><button class="chip add" data-a="rpick" data-m="${esc(m.id)}">+😀</button><div class="pick" data-p="${esc(m.id)}" hidden>${EM.map((em,i)=>`<button class="chip" data-a="react" data-m="${esc(m.id)}" data-e="${i}">${em}</button>`).join("")}</div></span></div></div></div>`}).join("")
 :'<div class="note" style="padding:0">No messages yet. Say something!</div>';
 if(atBot||list.length!=lastN)box.scrollTop=box.scrollHeight;lastN=list.length;
}
async function renderProfile(){
 $("head").textContent="My profile";$("f").hidden=true;
 const ps=await names([me]);if(view!="profile")return;
 const p=profiles[me]||{};pColor=pColor||p.color||COLORS[0];
 $("body").innerHTML=`<div class="pcard"><div class="banner" style="background:${esc(pColor)}"></div><div class="pin">${av(me,ps,"big")}
 ${assets?`<button data-a="upAv" style="margin-top:8px;font-weight:700">📷 Upload picture</button>`:""}${p.avatar?` <button class="x" data-a="rmAv">Remove</button>`:""}
 <label>Nickname<input id="pn" maxlength="24" value="${esc(p.nick||"")}" placeholder="Pick a nickname"></label>
 <label>Color<div class="sw">${COLORS.map(c=>`<button data-a="col" data-v="${c}" class="${c==pColor?"on":""}" style="background:${c}" aria-label="${c}"></button>`).join("")}</div></label>
 <label>Status<input id="pst" maxlength="40" value="${esc(p.status||"")}" placeholder="What are you up to?"></label>
 <label>About me<textarea id="pb" rows="3" maxlength="190">${esc(p.bio||"")}</textarea></label>
 <button data-a="saveProf" style="margin-top:14px">Save</button> <button class="g" data-a="signout" style="margin-top:14px">Sign out</button></div></div>`;
}
async function showCard(u){
 const ps=await names([u]),p=profiles[u]||{},rr=cur?roleOf(cur,u):null;
 $("card").innerHTML=`<div class="pcard"><div class="banner" style="background:${esc(p.color||"#5865f2")}"></div><div class="pin">${av(u,ps,"big")}
 <h3 style="margin:8px 0 0;color:#fff">${esc(dn(ps,u))}</h3>${rr?`<span class="tag" style="margin:0">${RN[rr]}</span>`:""}
 ${p.status?`<div class="stat" style="margin-top:6px">${esc(p.status)}</div>`:""}${p.bio?`<p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(p.bio)}</p>`:""}</div></div>`;
 $("card").style.display="grid";
}
const msgCol=()=>db.collection(`servers/${cur}/ch/${curCh}/msgs`);
function syncSub(){
 const k=view=="chat"&&cur&&curCh&&roleOf(cur,me)?cur+"/"+curCh:"";
 if(k===subKey)return;subKey=k;if(unsub){unsub();unsub=null}msgs=[];
 if(!k)return;
 timer=setTimeout(()=>note("Can't reach the chat yet…"),10000);
 unsub=msgCol().orderBy("t","desc").limit(100).onSnapshot(snap=>{
  if(!snap.metadata.fromCache){clearTimeout(timer);note("")}
  msgs=snap.docs.map(d=>({...d.data(),id:d.id}));renderMsgs();
 },e=>{clearTimeout(timer);note("Chat error: "+e.code)});
}
function openServer(id){cur=id;const cs=chans(S());curCh=cs[0]?.[0]||null;view=curCh?"chat":"members";syncSub();render()}

document.body.addEventListener("click",async e=>{
 const el=e.target.closest("[data-a]");if(!el||!db)return;if(el.id=="card"&&e.target!==el)return;
 const a=el.dataset.a,u=el.dataset.u,cid=el.dataset.c,s=S();
 if(a=="open")openServer(el.dataset.s);
 else if(a=="discover"){view="discover";syncSub();render()}
 else if(a=="chan"){curCh=cid;view="chat";syncSub();render()}
 else if(a=="members"){view="members";syncSub();render()}
 else if(a=="newServer")sure("Are you sure you want to make a server?",()=>ask("Name your server",async n=>{
  const c=newId(),t=Date.now();
  try{const ref=await db.collection("servers").add({name:n,owner:me,t,members:{[me]:"owner"},modOf:{},reqs:{},pend:{},chans:{[c]:{name:"general",t}}});
   servers[ref.id]=servers[ref.id]||{name:n,owner:me,t,members:{[me]:"owner"},modOf:{},reqs:{},pend:{},chans:{[c]:{name:"general",t}}};openServer(ref.id)}
  catch(err){note("Couldn't make it: "+err.code)}}))
 else if(a=="join")upd(el.dataset.s,{reqs:{[me]:Date.now()}});
 else if(a=="newChan")ask("Name the new chat",n=>upd(cur,{chans:{[newId()]:{name:n.toLowerCase().replace(/\s+/g,"-"),t:Date.now()}}}));
 else if(a=="delChan"){e.stopPropagation();
  if(myR()==5)save(cur,d=>{delete d.chans[cid];if(d.pend)delete d.pend[cid]});
  else if(myR()==4){upd(cur,{pend:{[cid]:me}});note("Asked the owner to delete it.")}}
 else if(a=="okDel")save(cur,d=>{delete d.chans[cid];delete d.pend[cid]});
 else if(a=="noDel")save(cur,d=>{delete d.pend[cid]});
 else if(a=="accept")save(cur,d=>{delete d.reqs[u];d.members[u]="normal"});
 else if(a=="deny")save(cur,d=>{delete d.reqs[u]});
 else if(a=="kick")save(cur,d=>{delete d.members[u];if(d.modOf)delete d.modOf[u]});
 else if(a=="leave"){const id=cur;cur=null;view="discover";syncSub();save(id,d=>{delete d.members[me];if(d.modOf)delete d.modOf[me]})}
 else if(a=="delServer"){if(el.dataset.sure){const id=cur;cur=null;view="discover";syncSub();render();db.doc("servers/"+id).delete()}else{el.dataset.sure=1;el.textContent="Tap again to delete for real"}}
 else if(a=="signout")signOut(auth).then(()=>location.reload());
 else if(a=="profile"){view="profile";pColor=null;syncSub();render()}
 else if(a=="prof"){e.stopPropagation();showCard(u)}
 else if(a=="closeCard")$("card").style.display="none";
 else if(a=="col"){pColor=el.dataset.v;document.querySelector(".banner").style.background=pColor;document.querySelectorAll(".sw button").forEach(b=>b.classList.toggle("on",b===el))}
 else if(a=="saveProf"){const p={...(profiles[me]||{}),nick:$("pn").value.trim(),status:$("pst").value.trim(),bio:$("pb").value.trim(),color:pColor};
  try{await db.doc("profiles/"+me).set(p);note("Saved!")}catch(err){note("Couldn't save: "+err.code)}}
 else if(a=="upAv"){fileFor="av";$("file").click()}
 else if(a=="rmAv"){const p={...(profiles[me]||{})};delete p.avatar;db.doc("profiles/"+me).set(p)}
 else if(a=="rpick"){const pk=document.querySelector(`[data-p="${CSS.escape(el.dataset.m)}"]`);if(pk)pk.hidden=!pk.hidden}
 else if(a=="react"){const m=msgs.find(x=>x.id==el.dataset.m);if(!m)return;const k="r"+el.dataset.e,on=!!m.re?.[k]?.[me];
  msgCol().doc(m.id).update({re:{[k]:{[me]:!on}}}).catch(err=>note("Couldn't react: "+err.code))}
 else if(a=="sendGif"){$("gifbox").hidden=true;if(!curCh)return;try{await msgCol().add({uid:me,gif:+el.dataset.g,text:"",t:Date.now()})}catch(err){note("Couldn't send: "+(err.code||err.message))}}
 else if(a=="delMsg")msgCol().doc(el.dataset.m).delete().catch(err=>note("Couldn't delete: "+err.code));
});
document.body.addEventListener("change",e=>{
 const el=e.target;if(el.tagName!="SELECT"||!el.dataset.u)return;
 const u=el.dataset.u,[role,cid]=el.value.split(":");
 save(cur,d=>{d.members[u]=role;d.modOf=d.modOf||{};if(role=="mod")d.modOf[u]=cid;else delete d.modOf[u]});
});

$("gifs").innerHTML=GIFS.map((g,i)=>`<button type="button" data-a="sendGif" data-g="${i}">${gifHtml(i)}</button>`).join("");
$("gifPick").onclick=()=>{$("gifbox").hidden=!$("gifbox").hidden};$("gifClose").onclick=()=>{$("gifbox").hidden=true};
$("gifBtn").onclick=()=>{fileFor="msg";$("file").click()};
$("file").onchange=async()=>{
 const f=$("file").files[0];$("file").value="";if(!f||!assets)return;
 if(!f.type.startsWith("image/")){note("Pick a picture or GIF.");return}
 note("Uploading…");
 try{const res={id:await shrink(f,fileFor=="av"?256:900)};
  if(fileFor=="av"){const p={...(profiles[me]||{}),avatar:res.id};await db.doc("profiles/"+me).set(p);profiles[me]=p;const b=document.querySelector(".av.big");if(b)b.outerHTML=av(me,await names([me]),"big")}
  else if(curCh)await msgCol().add({uid:me,img:res.id,text:"",t:Date.now()});
  note("")}catch(err){note("Upload failed: "+(err.message||err.code))}
};
$("f").onsubmit=async e=>{
 e.preventDefault();const t=$("i").value.trim();if(!t)return;
 if(!db||!curCh){note("Pick a chat first.");return}
 $("i").value="";let col;
 try{col=msgCol();await col.add({uid:me,text:t.slice(0,2000),t:Date.now()})}
 catch(err){$("i").value=t;note(err.code==="invalid_argument"?"You're not allowed to post here.":"Couldn't send: "+(err.code||err.message));return}
};

render();
let started=false;
function start(){
 if(started)return;started=true;
 db.collection("profiles").onSnapshot(snap=>{profiles={};snap.docs.forEach(d=>profiles[d.id]=d.data());if(view=="chat")renderMsgs();else if(view=="members")renderMembers();renderBar();renderMe()},()=>{});
 db.collection("servers").onSnapshot(snap=>{
  note("");
  servers={};snap.docs.forEach(d=>servers[d.id]=d.data());
  if(cur&&!roleOf(cur,me)){cur=null;view="discover"}
  if(cur&&curCh&&!S().chans?.[curCh]){curCh=chans(S())[0]?.[0]||null;if(!curCh&&view=="chat")view="members"}
  syncSub();if(view=="profile")renderBar();else render();
 },e=>note("Error: "+e.code));
}
if(!firebaseConfig.apiKey){$("gmsg").textContent="Setup needed: paste your Firebase config at the top of index.html.";$("signin").hidden=true}
else{
 const app=initializeApp(firebaseConfig);fs=getFirestore(app);auth=getAuth(app);
 db={collection:p=>C(collection(fs,p)),doc:p=>D(doc(fs,p))};
 $("gifBtn").hidden=false;
 $("signin").onclick=async()=>{const pr=new GoogleAuthProvider();try{await signInWithPopup(auth,pr)}catch(e){if(e.code!="auth/popup-closed-by-user"&&e.code!="auth/cancelled-popup-request")signInWithRedirect(auth,pr);else $("gmsg").textContent="Sign-in failed: "+e.code}};
 onAuthStateChanged(auth,u=>{if(u){me=u.uid;$("gate").style.display="none";start()}else{$("gate").style.display="grid"}});
}
}
</script></body></html>
