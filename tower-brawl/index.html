<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tower Brawl</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1d3a1f;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100vw;height:100vh}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,25,45,.55),rgba(4,10,20,.88));color:#fff;text-align:center;z-index:5;padding:20px;box-sizing:border-box}
.hidden{display:none!important}
h1{font-size:clamp(44px,12vw,82px);margin:0 0 4px;letter-spacing:1px;background:linear-gradient(#fff3c4,#ffb02e 60%,#e07a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #6b2f00) drop-shadow(0 10px 18px rgba(0,0,0,.6));font-weight:900;line-height:1}
h2{font-size:clamp(36px,10vw,60px);margin:0 0 8px;font-weight:900;filter:drop-shadow(0 4px 0 rgba(0,0,0,.5))}
.sub{opacity:.88;margin:10px 0 22px;font-size:16px;max-width:330px;line-height:1.45}
.btn{font:800 20px system-ui,-apple-system,sans-serif;color:#fff;border:0;border-radius:16px;padding:14px 40px;margin:7px;background:linear-gradient(#5fb0ff,#1f6fe0);box-shadow:0 5px 0 #0d3f8a,0 10px 22px rgba(0,0,0,.45);cursor:pointer;min-width:200px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0d3f8a}
.btn.red{background:linear-gradient(#ff7676,#d63131);box-shadow:0 5px 0 #7d1414,0 10px 22px rgba(0,0,0,.45)}
.btn.gray{background:linear-gradient(#97a1b3,#5b6577);box-shadow:0 5px 0 #2f3644,0 10px 22px rgba(0,0,0,.45)}
.btn.gold{background:linear-gradient(#ffd25e,#f09a16);box-shadow:0 5px 0 #8a4f00,0 10px 22px rgba(0,0,0,.45);color:#3a1d00}
.grid{display:grid;grid-template-columns:repeat(4,62px);gap:12px;margin:6px 0 18px}
.lv{width:62px;height:62px;border-radius:15px;font:900 24px system-ui,sans-serif;color:#fff;border:0;background:linear-gradient(#5fb0ff,#1f6fe0);box-shadow:0 4px 0 #0d3f8a;cursor:pointer}
.lv.done{background:linear-gradient(#7be07b,#2e9e3a);box-shadow:0 4px 0 #19621f}
.lv.locked{background:linear-gradient(#6b7280,#4b5260);box-shadow:0 4px 0 #2a2f38;opacity:.55;cursor:default}
.lbl{font-size:13px;letter-spacing:2px;opacity:.7;margin-top:6px;font-weight:700}
#pauseBtn{position:fixed;top:10px;left:12px;width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:linear-gradient(#6aa0f5,#3d6fd6);color:#fff;font:900 16px system-ui;z-index:4;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);line-height:1;padding:0}
.stat{font-size:18px;margin-bottom:18px;opacity:.9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="pauseBtn" class="hidden">❚❚</button>

<div id="menu" class="ui">
  <h1>TOWER<br>BRAWL</h1>
  <div class="sub">Drag from your <b style="color:#7cb8ff">blue</b> towers to send troops.<br>Swipe across a line to cut it.</div>
  <button class="btn gold" id="playBtn">PLAY</button>
  <div class="lbl">LEVELS</div>
  <div class="grid" id="grid"></div>
</div>

<div id="pause" class="ui hidden">
  <h2>Paused</h2>
  <button class="btn" id="resumeBtn">Resume</button>
  <button class="btn gray" id="restartBtn">Restart</button>
  <button class="btn gray" id="menuBtn1">Menu</button>
</div>

<div id="win" class="ui hidden">
  <h2 style="color:#ffd25e">Victory!</h2>
  <div class="stat" id="winStat"></div>
  <button class="btn gold" id="nextBtn">Next Level</button>
  <button class="btn gray" id="menuBtn2">Menu</button>
</div>

<div id="lose" class="ui hidden">
  <h2 style="color:#ff7676">Defeated</h2>
  <div class="stat">Your towers have fallen.</div>
  <button class="btn red" id="retryBtn">Try Again</button>
  <button class="btn gray" id="menuBtn3">Menu</button>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);

const COL={
 0:{m:'#9aa3ae',d:'#5f6873',l:'#c9d0d8',f:'#f2f2f2'},
 1:{m:'#4a7fe0',d:'#2a4f9e',l:'#7fa8f0',f:'#4a7fe0'},
 2:{m:'#e04848',d:'#9a2626',l:'#f08585',f:'#e04848'},
 3:{m:'#b05cff',d:'#4f1a8f',l:'#e3c2ff',f:'#a84dff'}
};
const AI_OWNERS=[2,3];

// [nx, ny, owner, count]
const LEVELS=[
 {name:'First Steps',th:'grass',ai:5.5,t:[[.5,.86,1,12],[.25,.56,0,4],[.75,.56,0,5],[.5,.17,2,6]]},
 {name:'Open Field',th:'grass',ai:3.4,t:[[.2,.86,1,15],[.5,.7,0,6],[.82,.86,0,9,'p'],[.2,.46,0,8],[.8,.46,0,6],[.5,.3,0,10],[.5,.12,2,12]]},
 {name:'Two Fronts',th:'snow',ai:3.0,w:[[.3,.4,.7,.4]],t:[[.5,.88,1,20],[.15,.64,0,5],[.85,.64,0,5],[.5,.52,0,16],[.5,.27,0,8,'p'],[.15,.14,2,10],[.85,.14,2,10]]},
 {name:'Surrounded',th:'desert',ai:2.8,t:[[.5,.5,1,25],[.15,.12,2,10],[.85,.12,2,10],[.5,.9,2,12],[.18,.5,0,6],[.82,.5,0,6],[.5,.26,0,7],[.3,.74,0,6],[.7,.74,0,6]]},
 {name:'Three Kingdoms',th:'grass',ai:2.6,w:[[.38,.62,.62,.62]],t:[[.5,.88,1,16],[.13,.14,2,16],[.87,.14,3,16],[.5,.5,0,14],[.25,.36,0,6],[.75,.36,0,6],[.25,.68,0,7],[.75,.68,0,7],[.5,.2,0,9,'p']]},
 {name:'The Fortress',th:'snow',ai:2.3,w:[[.18,.27,.4,.27],[.6,.27,.82,.27]],t:[[.5,.17,2,40],[.25,.1,2,14],[.75,.1,2,14],[.2,.87,1,15],[.8,.87,1,15],[.5,.6,0,20],[.13,.5,0,8],[.87,.5,0,8],[.5,.85,0,5,'p'],[.35,.36,0,10],[.65,.36,0,10]]},
 {name:'Blitz',th:'desert',ai:1.7,t:[[.5,.9,1,18],[.5,.1,2,18],[.15,.25,2,8],[.85,.75,0,8],[.15,.75,0,8],[.85,.25,0,8],[.35,.5,0,6],[.65,.5,0,6],[.5,.65,0,10],[.5,.35,0,10],[.12,.5,0,12,'p'],[.88,.5,0,12,'p']]},
 {name:'Final War',th:'snow',ai:1.35,w:[[.24,.6,.41,.6],[.59,.6,.76,.6]],t:[[.5,.89,1,22],[.2,.78,1,8],[.13,.12,2,22],[.87,.12,3,22],[.35,.14,2,10],[.65,.14,3,10],[.5,.3,0,18],[.18,.45,0,9],[.82,.45,0,9],[.5,.55,0,12],[.32,.68,0,7],[.68,.68,0,7],[.82,.82,0,10,'p']]}
];

let W,H,DPR,FX,FY,FW,FH,TR,bg,walls=[];
let towers=[],links=[],units=[],parts=[],rings=[],arrows=[];
let state='menu',lvlIdx=0,time=0,aiT={},endT=0,ended=null,playTime=0;
let drag=null,cutTrail=[],madeLink=false,hint2=0;
let unlocked=1;
try{unlocked=Math.max(1,parseInt(localStorage.getItem('tb_unlocked')||'1'))}catch(e){}

function rnd(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}

function resize(){
 DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
 cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
 const top=78,bot=36;FH=H-top-bot;FW=Math.min(W-50,FH*0.78);FX=(W-FW)/2;FY=top;
 TR=Math.max(21,Math.min(40,FW*0.08));
 place();buildBG();
}
function place(){for(const t of towers){t.x=FX+t.nx*FW;t.y=FY+t.ny*FH}
 const L=state==='menu'?null:LEVELS[lvlIdx];
 walls=(L&&L.w||[]).map(([a,b,c,d])=>({a:{x:FX+a*FW,y:FY+b*FH},b:{x:FX+c*FW,y:FY+d*FH}}));}
function blocked(a,b){for(const w of walls)if(segInt({x:a.x,y:a.y},{x:b.x,y:b.y},w.a,w.b)>=0)return true;return false}

function rrg(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
const THEMES={
 grass:{g1:'#a3dc7c',g2:'#86c860',patch:'rgba(255,255,255,.13)',rockD:'#6c7682',rockL:'#a3adb8',capC:'#7cbf55'},
 snow:{g1:'#f1f7fd',g2:'#dcebf8',patch:'rgba(175,215,242,.55)',rockD:'#3d4b63',rockL:'#5d6c86',capC:'#ffffff'},
 desert:{g1:'#f5dfa6',g2:'#e9c886',patch:'rgba(255,255,255,.18)',rockD:'#b5794a',rockL:'#d79d68',capC:'#f0cf92'}};
function themeName(){return state==='menu'||!LEVELS[lvlIdx]?'grass':(LEVELS[lvlIdx].th||'grass')}
function shade(h,f){const n=parseInt(h.slice(1),16);const c=v=>Math.max(0,Math.min(255,Math.round(v*f)));return`rgb(${c(n>>16)},${c((n>>8)&255)},${c(n&255)})`}
function blob(g,x,y,rx,ry,r){g.beginPath();for(let i=0;i<=14;i++){const a=i/14*Math.PI*2,k=.82+r()*.3;const px=x+Math.cos(a)*rx*k,py=y+Math.sin(a)*ry*k;i?g.lineTo(px,py):g.moveTo(px,py)}g.closePath()}
function buildBG(){
 bg=document.createElement('canvas');bg.width=W*DPR;bg.height=H*DPR;
 const g=bg.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);
 const th=themeName(),T=THEMES[th],r=rnd(th.length*97+lvlIdx*13+5);
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,T.g1);gr.addColorStop(1,T.g2);g.fillStyle=gr;g.fillRect(0,0,W,H);
 // soft ground patches (ice sheets on snow)
 for(let i=0;i<7;i++){const x=FX+r()*FW,y=FY+r()*FH,rx=FW*(.25+r()*.3),ry=rx*.55;
  g.fillStyle=T.patch;blob(g,x,y,rx,ry,r);g.fill();
  if(th==='snow'){g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=2.5;g.stroke()}}
 if(th!=='snow')for(let i=0;i<W*H/700;i++){const x=r()*W,y=r()*H;g.fillStyle=th==='grass'?(r()<.5?'rgba(60,130,40,.18)':'rgba(255,255,255,.18)'):'rgba(160,110,50,.15)';g.fillRect(x,y,2,2)}
 // decor outside field
 const dec=[];
 for(let i=0;i<900&&dec.length<40;i++){const x=r()*W,y=r()*H;
  if(x>FX-6&&x<FX+FW+6&&y>FY-14&&y<FY+FH+10)continue;
  if(dec.some(q=>Math.hypot(q[0]-x,q[1]-y)<22))continue;dec.push([x,y,r()])}
 // big rock clusters at top corners
 for(const[x,y,s]of[[W*.12,FY*.35,TR*2.2],[W*.55,FY*.15,TR*2.6],[W*.92,FY*.4,TR*2]])rock(g,x,y,s,T,r);
 dec.sort((p,q)=>p[1]-q[1]);
 for(const[x,y,k]of dec){const s=10+k*8;
  if(k<.25)rock(g,x,y,s*1.2,T,r);
  else if(th==='desert')cactus(g,x,y,s);
  else if(th==='snow'&&k>.93)snowman(g,x,y,s);
  else pine(g,x,y,s,th);}
 // wall blocks
 for(const w of walls){const len=Math.hypot(w.b.x-w.a.x,w.b.y-w.a.y),cs=TR*.78,n=Math.max(1,Math.round(len/cs));
  const pts=[];for(let i=0;i<n;i++){const u=(i+.5)/n;pts.push([w.a.x+(w.b.x-w.a.x)*u,w.a.y+(w.b.y-w.a.y)*u])}
  pts.sort((p,q)=>p[1]-q[1]);for(const[x,y]of pts)cube(g,x,y,cs*1.02,th,r)}
}
function rock(g,x,y,s,T,r){
 g.fillStyle='rgba(0,0,0,.12)';blob(g,x+s*.15,y+s*.25,s*1.05,s*.45,r);g.fill();
 g.fillStyle=T.rockD;g.beginPath();g.moveTo(x-s,y+s*.2);g.lineTo(x-s*.7,y-s*.5);g.lineTo(x-s*.1,y-s*.75);g.lineTo(x+s*.6,y-s*.55);g.lineTo(x+s,y+s*.1);g.lineTo(x+s*.4,y+s*.4);g.lineTo(x-s*.5,y+s*.4);g.closePath();g.fill();
 g.fillStyle=T.rockL;g.beginPath();g.moveTo(x-s*.7,y-s*.5);g.lineTo(x-s*.1,y-s*.75);g.lineTo(x+s*.2,y-s*.1);g.lineTo(x-s*.6,y+s*.05);g.closePath();g.fill();
 g.fillStyle=T.capC;g.beginPath();g.moveTo(x-s*.72,y-s*.48);g.lineTo(x-s*.1,y-s*.75);g.lineTo(x+s*.6,y-s*.55);g.lineTo(x+s*.45,y-s*.38);g.lineTo(x,y-s*.5);g.lineTo(x-s*.5,y-s*.3);g.closePath();g.fill();
}
function pine(g,x,y,s,th){
 g.fillStyle='rgba(0,0,0,.14)';g.beginPath();g.ellipse(x+s*.3,y+2,s*.7,s*.25,0,0,7);g.fill();
 g.fillStyle='#7a4a26';g.fillRect(x-s*.12,y-s*.45,s*.24,s*.45);
 const greens=th==='snow'?['#2f7a4a','#3f9a5d']:['#2f8a3a','#47aa4e'];
 for(const[k,w]of[[0,.75],[.5,.6],[.95,.42]]){const by=y-s*.35-k*s,ty=by-s*.85;
  g.fillStyle=greens[0];g.beginPath();g.moveTo(x-s*w,by);g.lineTo(x,ty);g.lineTo(x,by+s*.08);g.fill();
  g.fillStyle=greens[1];g.beginPath();g.moveTo(x+s*w,by);g.lineTo(x,ty);g.lineTo(x,by+s*.08);g.fill();
  if(th==='snow'){g.fillStyle='#fff';g.beginPath();g.moveTo(x-s*w*.55,by-s*.35);g.lineTo(x,ty);g.lineTo(x+s*w*.55,by-s*.35);g.lineTo(x,by-s*.22);g.fill()}}
}
function cactus(g,x,y,s){g.fillStyle='rgba(0,0,0,.14)';g.beginPath();g.ellipse(x+s*.3,y+2,s*.5,s*.2,0,0,7);g.fill();
 g.lineCap='round';g.strokeStyle='#3f9a4a';g.lineWidth=s*.38;g.beginPath();g.moveTo(x,y);g.lineTo(x,y-s*1.4);g.stroke();
 g.lineWidth=s*.26;g.beginPath();g.moveTo(x,y-s*.6);g.lineTo(x-s*.45,y-s*.6);g.lineTo(x-s*.45,y-s*1.05);g.moveTo(x,y-s*.85);g.lineTo(x+s*.42,y-s*.85);g.lineTo(x+s*.42,y-s*1.2);g.stroke();
 g.strokeStyle='rgba(255,255,255,.3)';g.lineWidth=s*.08;g.beginPath();g.moveTo(x-s*.07,y-s*.1);g.lineTo(x-s*.07,y-s*1.3);g.stroke()}
function snowman(g,x,y,s){g.fillStyle='rgba(0,0,0,.12)';g.beginPath();g.ellipse(x+s*.3,y+2,s*.6,s*.2,0,0,7);g.fill();
 for(const[yy,rr]of[[y-s*.45,s*.5],[y-s*1.15,s*.35]]){const rg=g.createRadialGradient(x-rr*.3,yy-rr*.3,1,x,yy,rr);rg.addColorStop(0,'#fff');rg.addColorStop(1,'#cfe0ee');g.fillStyle=rg;g.beginPath();g.arc(x,yy,rr,0,7);g.fill()}
 g.fillStyle='#ff8a2a';g.beginPath();g.moveTo(x,y-s*1.15);g.lineTo(x+s*.35,y-s*1.1);g.lineTo(x,y-s*1.05);g.fill();
 g.fillStyle='#3a4250';g.fillRect(x-s*.3,y-s*1.5,s*.6,s*.08);g.fillRect(x-s*.2,y-s*1.75,s*.4,s*.27)}
function cube(g,x,y,s,th,r){
 const P={snow:['#d8f1ff','#86c8f0','#5fa9dc'],grass:['#d3d7dc','#9aa1aa','#7a818a'],desert:['#f0d29a','#cf9f5f','#b48348']}[th];
 const h=s*.75,d=s*.42,x0=x-s/2,y0=y-h;
 g.fillStyle='rgba(0,0,0,.15)';g.fillRect(x0+4,y-2,s,6);
 g.fillStyle=P[1];g.fillRect(x0,y0,s,h);
 g.fillStyle=P[0];g.fillRect(x0,y0-d,s,d);
 g.strokeStyle=th==='snow'?'rgba(255,255,255,.8)':'rgba(0,0,0,.15)';g.lineWidth=1.5;g.strokeRect(x0+1,y0-d+1,s-2,h+d-2);
 g.beginPath();g.moveTo(x0,y0);g.lineTo(x0+s,y0);g.stroke();
 if(th==='snow'){g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=1.2;g.beginPath();g.moveTo(x0+s*.2,y0+h*.2);g.lineTo(x0+s*.45,y0+h*.5);g.lineTo(x0+s*.35,y0+h*.8);g.moveTo(x0+s*.45,y0+h*.5);g.lineTo(x0+s*.75,y0+h*.4);g.stroke()}
}

const lvlOf=c=>c>=30?3:c>=10?2:1;
const CAP=70;
const pa=t=>({x:t.x,y:t.y});
const RY=.78;
function archRange(t){return FW*[.3,.38,.47][lvlOf(t.count)-1]}
function rangeDist(a,b){return Math.hypot(b.x-a.x,(b.y-a.y)/RY)}

function loadLevel(i){
 lvlIdx=i;const L=LEVELS[i];
 towers=L.t.map(([nx,ny,o,c,ty])=>({nx,ny,owner:o,count:c,type:ty||'b',growT:0,hit:0,x:0,y:0,flip:0}));
 links=[];units=[];parts=[];rings=[];arrows=[];drag=null;cutTrail=[];
 aiT={2:L.ai*.8,3:L.ai*.9};ended=null;endT=0;playTime=0;madeLink=false;hint2=0;
 state='play';place();buildBG();
 for(const id of['menu','pause','win','lose'])$(id).classList.add('hidden');
 $('pauseBtn').classList.remove('hidden');
}

function linksFrom(t){return links.filter(l=>l.from===t)}
function createLink(a,b,o){
 if(a===b||a.owner!==o||a.type==='p'||blocked(a,b))return false;
 if(links.some(l=>l.from===a&&l.to===b))return false;
 const rev=links.find(l=>l.from===b&&l.to===a&&l.owner===o);
 if(rev)removeLink(rev,0);
 const mine=linksFrom(a);
 if(mine.length>=lvlOf(a.count))removeLink(mine[0],1);
 links.push({from:a,to:b,owner:o,spawnT:0,born:time});
 return true;
}
function removeLink(l,s){
 const i=links.indexOf(l);if(i<0)return;links.splice(i,1);
 if(s!==undefined)for(const u of units)if(u.a===l.from&&u.b===l.to&&u.o===l.owner&&u.dir===1&&u.t<s)u.dir=-1;
}

function arrive(u,t){
 if(t.owner===u.o){t.count++;t.hit=.08;return}
 t.count--;t.hit=.15;
 spark(t.x,t.y-TR*.5,COL[u.o].m,4);
 if(t.count<0){
  const old=t.owner;t.owner=u.o;t.count=1;t.flip=1;
  for(const l of links.slice())if(l.from===t)removeLink(l);
  burst(t.x,t.y-TR*.8,COL[u.o].m,COL[old].m);
 }
}

function spark(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*7,s=40+Math.random()*90;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:.35+Math.random()*.2,max:.5,c,s:2+Math.random()*2})}}
function burst(x,y,c,c2){
 for(let i=0;i<34;i++){const a=Math.random()*7,s=60+Math.random()*200;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:.6+Math.random()*.5,max:1.1,c:i%3?c:c2,s:2.5+Math.random()*3.5,g:1})}
 rings.push({x,y:y+TR*.6,r:TR*.5,life:.6,c});
}

// ---------- AI ----------
function aiThink(o){
 const mine=towers.filter(t=>t.owner===o);if(!mine.length)return;
 mine.sort(()=>Math.random()-.5);
 for(const t of mine){
  if(t.type==='p')continue;
  const ls=linksFrom(t);
  // drop a hopeless attack
  for(const l of ls){if(l.to.owner!==o&&t.count<2&&l.to.count>t.count+8){removeLink(l,.5);return}}
  if(ls.length>=lvlOf(t.count)||t.count<5)continue;
  let best=null,bs=-1e9;
  for(const x of towers){
   if(x===t||ls.some(l=>l.to===x)||blocked(t,x))continue;
   const d=Math.hypot(x.x-t.x,x.y-t.y)/FW;let sc;
   if(x.owner===o){
    const threatened=links.some(l=>l.to===x&&l.owner!==o);
    if((x.count<8||threatened)&&t.count>18)sc=6-d*5+(threatened?4:0);else continue;
   }else{
    let power=t.count;for(const l of links)if(l.to===x&&l.owner===o)power+=l.from.count*.7;
    const need=x.count+3;if(power<need)continue;
    sc=12-x.count*.25-d*7+(x.owner===1?3:0)+(x.owner===0?1.5:0)+(x.owner!==0&&x.owner!==1?1:0);
   }
   if(sc>bs){bs=sc;best=x}
  }
  if(best){createLink(t,best,o);return}
 }
}

// ---------- update ----------
function update(dt){
 time+=dt;
 if(state!=='play')return;
 playTime+=dt;
 for(const t of towers){
  t.hit=Math.max(0,t.hit-dt);t.flip=Math.max(0,t.flip-dt*2);
  if(t.owner!==0){const iv=[1.1,.85,.65][lvlOf(t.count)-1];t.growT+=dt;while(t.growT>=iv){t.growT-=iv;if(t.count<CAP)t.count++}}
 }

 for(const t of towers){if(t.type!=='p'||t.owner===0)continue;
  const lv=lvlOf(t.count);t.shotT=(t.shotT||0)+dt;
  if(t.shotT<[1.6,1.1,.7][lv-1])continue;
  let best=null,bd=1e9;for(const o of towers){if(o.owner===t.owner||o.owner===0||o.count<=0)continue;const d=rangeDist(t,o);if(d<=archRange(t)&&d<bd){bd=d;best=o}}
  if(best){t.shotT=0;arrows.push({sx:t.x,sy:t.labelY+TR*.3,tg:best,o:t.owner,k:0,dur:.55+bd/FW*.4})}else t.shotT=99;
 }
 for(const a of arrows){a.k+=dt/a.dur;if(a.k>=1&&!a.done){a.done=1;const t=a.tg;if(t.owner!==a.o&&t.count>0){t.count--;t.hit=.15;spark(t.x,t.y-TR*.8,'#fff4b0',5)}}}
 arrows=arrows.filter(a=>!a.done);
 for(const l of links.slice()){
  if(l.from.owner!==l.owner){removeLink(l);continue}
  l.spawnT+=dt;
  while(l.spawnT>=.38){l.spawnT-=.38;if(l.from.count>=1){l.from.count--;units.push({a:l.from,b:l.to,o:l.owner,t:0,dir:1})}}
 }
 const sp=FW*.26;
 for(const u of units){
  const A=pa(u.a),B=pa(u.b),len=Math.hypot(B.x-A.x,B.y-A.y)||1;
  u.t+=u.dir*sp*dt/len;u.walk=(u.walk||0)+dt*16;
  u.x=A.x+(B.x-A.x)*u.t;u.y=A.y+(B.y-A.y)*u.t;
  if(u.dir===1&&u.t>=1){arrive(u,u.b);u.dead=1}
  else if(u.dir===-1&&u.t<=0){arrive(u,u.a);u.dead=1}
 }
 const cr=TR*.32;
 for(let i=0;i<units.length;i++){const u=units[i];if(u.dead)continue;
  for(let j=i+1;j<units.length;j++){const v=units[j];if(v.dead||v.o===u.o)continue;
   if(Math.abs(u.x-v.x)<cr&&Math.abs(u.y-v.y)<cr){u.dead=v.dead=1;spark((u.x+v.x)/2,(u.y+v.y)/2,'#fff4b0',6);break}}}
 units=units.filter(u=>!u.dead);
 for(const o of AI_OWNERS){if(aiT[o]===undefined)continue;aiT[o]-=dt;if(aiT[o]<=0){aiT[o]=LEVELS[lvlIdx].ai*(.75+Math.random()*.5);aiThink(o)}}
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.vx*=.98;p.life-=dt}
 parts=parts.filter(p=>p.life>0);
 for(const r of rings){r.r+=TR*5*dt;r.life-=dt}
 rings=rings.filter(r=>r.life>0);
 if(hint2>0)hint2-=dt;
 // win / lose
 if(!ended){
  const aiAlive=towers.some(t=>t.owner>=2)||units.some(u=>u.o>=2);
  const meAlive=towers.some(t=>t.owner===1)||units.some(u=>u.o===1);
  if(!aiAlive)ended='win';else if(!meAlive)ended='lose';
  if(ended)endT=1;
 }else{endT-=dt;if(endT<=0)finish()}
}

function finish(){
 state=ended;drag=null;$('pauseBtn').classList.add('hidden');
 if(ended==='win'){
  if(lvlIdx+2>unlocked){unlocked=Math.min(LEVELS.length,lvlIdx+2);try{localStorage.setItem('tb_unlocked',unlocked)}catch(e){}}
  const s=Math.round(playTime);$('winStat').textContent=`${LEVELS[lvlIdx].name} cleared in ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  $('nextBtn').textContent=lvlIdx<LEVELS.length-1?'Next Level':'Play Again';
  $('win').classList.remove('hidden');
 }else $('lose').classList.remove('hidden');
}

// ---------- drawing ----------
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function cyl(x,yb,rw,hh,d,m,l,top){
 const ry=rw*.36;const g=ctx.createLinearGradient(x-rw,0,x+rw,0);
 g.addColorStop(0,d);g.addColorStop(.3,l);g.addColorStop(.55,m);g.addColorStop(1,d);
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-rw,yb-hh);ctx.lineTo(x-rw,yb);ctx.ellipse(x,yb,rw,ry,0,Math.PI,0,true);ctx.lineTo(x+rw,yb-hh);ctx.closePath();ctx.fill();
 ctx.fillStyle=top;ell(x,yb-hh,rw,ry);
}

const SQ=.6;
function oct(x,yb,r,h,side,top){
 const V=[];for(let k=0;k<8;k++){const a=(k*45+22.5)*Math.PI/180;V.push([Math.cos(a)*r,Math.sin(a)*r*SQ])}
 for(let k=0;k<8;k++){const mid=((k+.5)*45+22.5)*Math.PI/180;if(Math.sin(mid)<.05)continue;const p=V[k],q=V[(k+1)%8];
  const f=.8+.22*(-Math.cos(mid));ctx.fillStyle=shade(side,f);ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(x+p[0],yb+p[1]);ctx.lineTo(x+q[0],yb+q[1]);ctx.lineTo(x+q[0],yb+q[1]-h);ctx.lineTo(x+p[0],yb+p[1]-h);ctx.closePath();ctx.fill();ctx.stroke()}
 ctx.fillStyle=top;ctx.beginPath();V.forEach((v,i)=>i?ctx.lineTo(x+v[0],yb-h+v[1]):ctx.moveTo(x+v[0],yb-h+v[1]));ctx.closePath();ctx.fill();
}
function drawTower(t){
 const c=COL[t.owner],R=TR,lv=lvlOf(t.count);
 let x=t.x,y=t.y;if(t.hit>0)x+=(Math.random()-.5)*4*(t.hit/.15);
 const sc=1+t.flip*.3;ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.translate(-x,-y);
 ctx.fillStyle='rgba(0,0,0,.16)';ell(x+R*.25,y+R*.15,R*1.1,R*.62);
 if(drag&&drag.from===t){ctx.fillStyle=hexA('#ffffff',.35+.2*Math.sin(time*8));ell(x,y,R*1.25,R*.75)}
 if(drag&&drag.over===t){ctx.strokeStyle=drag.bad?'#ff4040':'#fff';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(x,y,R*1.3,R*.8,0,0,7);ctx.stroke()}
 let top;
 if(t.type==='p'){
  // stilt watch post
  const pw=R*.75,ph=R*1.25,legs=[[-pw,-.3],[pw,-.3],[-pw*.85,.35],[pw*.85,.35]];
  ctx.lineCap='butt';
  for(const[lx,lz]of legs){ctx.strokeStyle=lz<0?'#c8ced6':'#e8ecf0';ctx.lineWidth=R*.16;ctx.beginPath();ctx.moveTo(x+lx,y+lz*R*.6);ctx.lineTo(x+lx*.92,y+lz*R*.6-ph);ctx.stroke()}
  ctx.strokeStyle='#d5dae0';ctx.lineWidth=R*.08;ctx.beginPath();ctx.moveTo(x-pw*.85,y+R*.2-ph*.35);ctx.lineTo(x+pw*.85,y+R*.2-ph*.35);ctx.stroke();
  const py=y-ph+R*.15;
  ctx.fillStyle=c.m;ctx.fillRect(x-pw*1.05,py-R*.32,pw*2.1,R*.32);
  ctx.fillStyle='#f2f4f7';ctx.fillRect(x-pw*1.05,py-R*.62,pw*2.1,R*.3);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(x-pw*.8,py-R*.55,pw*1.6,R*.12);
  const rb=py-R*.62,ax=x,ay=rb-R*.95,rw=pw*1.4;
  ctx.fillStyle=shade(c.m,1.12);ctx.beginPath();ctx.moveTo(x-rw,rb+R*.05);ctx.lineTo(x-rw*.65,rb-R*.32);ctx.lineTo(ax,ay);ctx.closePath();ctx.fill();
  ctx.fillStyle=shade(c.m,.78);ctx.beginPath();ctx.moveTo(x+rw,rb+R*.05);ctx.lineTo(x+rw*.65,rb-R*.32);ctx.lineTo(ax,ay);ctx.closePath();ctx.fill();
  ctx.fillStyle=c.m;ctx.beginPath();ctx.moveTo(x-rw,rb+R*.05);ctx.lineTo(x+rw,rb+R*.05);ctx.lineTo(ax,ay);ctx.closePath();ctx.fill();
  t.labelY=rb-R*.28;
 }else{
  const tiers=lv+1,r0=R*.98,thh=R*.42;let yb=y;
  oct(x,yb,r0*1.06,R*.1,shade(c.m,.8),c.m);yb-=R*.1;
  for(let i=0;i<tiers;i++){
   const r=r0*(1-i*.06);
   oct(x,yb,r,thh*.32,c.m,c.m);
   oct(x,yb-thh*.32,r,thh*.68,'#f1f3f6','#ffffff');
   const fy=yb+r*SQ;
   ctx.fillStyle='#2b313b';
   if(i===0){const dw=r*.34;ctx.fillRect(x-dw/2,fy-thh*.62,dw,thh*.62)}
   else{ctx.fillRect(x-r*.38,fy-thh*.62,r*.76,thh*.12);ctx.fillRect(x-r*.38,fy-thh*.4,r*.76,thh*.1)}
   yb-=thh;
  }
  const rc=r0*(1-tiers*.06)+R*.04;
  oct(x,yb,rc,thh*.42,c.m,shade(c.m,1.12));
  const ty=yb-thh*.42,used=linksFrom(t).length;
  for(let i=0;i<lv;i++){const dx=x+(i-(lv-1)/2)*rc*.42;ctx.fillStyle=i<used?shade(c.m,.7):'#ffffff';ell(dx,ty+rc*SQ*.25,R*.1,R*.08)}
  t.labelY=ty-R*.25;
 }
 ctx.restore();
}
function drawBadge(t){
 const R=TR,txt=String(t.count);
 ctx.font=`900 ${Math.round(R*.58)}px system-ui,-apple-system,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
 const y=(t.labelY||t.y-R*2);
 ctx.lineJoin='round';ctx.lineWidth=Math.max(3,R*.15);ctx.strokeStyle='rgba(30,40,60,.65)';ctx.strokeText(txt,t.x,y);
 ctx.fillStyle='#fff';ctx.fillText(txt,t.x,y);
}

function drawLink(l){
 const c=COL[l.owner],A=pa(l.from),B=pa(l.to);
 const grow=Math.min(1,(time-l.born)*4),dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)*grow,ang=Math.atan2(dy,dx),bw=TR*.62;
 ctx.save();ctx.translate(A.x,A.y);ctx.rotate(ang);
 ctx.fillStyle=hexA(c.m,.38);ctx.fillRect(0,-bw/2,len,bw);
 ctx.strokeStyle=hexA(c.m,.75);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-bw/2);ctx.lineTo(len,-bw/2);ctx.moveTo(0,bw/2);ctx.lineTo(len,bw/2);ctx.stroke();
 ctx.fillStyle=hexA(c.d,.45);const sp=TR*.42,off=(time*TR*.9)%sp;
 for(let d=off;d<len;d+=sp){ctx.beginPath();ctx.arc(d,(Math.floor((d-off)/sp)%2?-1:1)*bw*.12,TR*.045,0,7);ctx.fill()}

}

function drawUnit(u){
 const c=COL[u.o],s=TR*.2,x=u.x,y=u.y,ph=u.walk||0;
 const fd=((u.b.x-u.a.x)*u.dir)>=0?1:-1;
 ctx.fillStyle='rgba(0,0,0,.2)';ell(x,y+1,s*.95,s*.4);
 ctx.fillStyle=c.d;
 ell(x-s*.35,y-s*.15+Math.sin(ph)*s*.15,s*.25,s*.2);ell(x+s*.35,y-s*.15-Math.sin(ph)*s*.15,s*.25,s*.2);
 const bg=ctx.createLinearGradient(x-s,0,x+s,0);bg.addColorStop(0,shade(c.m,1.15));bg.addColorStop(1,shade(c.m,.8));
 ctx.fillStyle=bg;ell(x,y-s*.85,s*.78,s*.72);
 ctx.fillStyle='#2b2f36';ctx.save();ctx.translate(x+fd*s*.25,y-s*.85);ctx.rotate(fd*.25);ctx.fillRect(fd>0?0:-s*1.2,-s*.12,s*1.2,s*.24);ctx.restore();
 ctx.fillStyle=shade(c.m,1.1);ell(x+fd*s*.4,y-s*.8,s*.22,s*.22);
 ctx.fillStyle='#f2c9a0';ell(x+fd*s*.05,y-s*1.7,s*.55,s*.55);
 ctx.fillStyle=shade(c.m,.92);ctx.beginPath();ctx.arc(x,y-s*1.82,s*.66,Math.PI,0);ctx.lineTo(x+s*.72,y-s*1.75);ctx.lineTo(x-s*.72,y-s*1.75);ctx.closePath();ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.35)';ell(x-s*.22,y-s*2.15,s*.2,s*.1);
}

function drawHUD(){
 const tot={};for(const t of towers)tot[t.owner]=(tot[t.owner]||0)+t.count;for(const u of units)tot[u.o]=(tot[u.o]||0)+1;
 const owners=[1,2,3].filter(o=>tot[o]);const sum=owners.reduce((s,o)=>s+tot[o],0)||1;
 const pw=Math.min(W*.58,280),ph=40,px=(W-pw)/2,py=12;
 ctx.fillStyle='rgba(0,0,0,.18)';rr(px,py+4,pw,ph,ph/2);ctx.fill();
 ctx.fillStyle='#fff';rr(px,py,pw,ph,ph/2);ctx.fill();
 ctx.save();rr(px+4,py+4,pw-8,ph-8,(ph-8)/2);ctx.clip();
 let x=px+4;for(const o of owners){const w=(pw-8)*tot[o]/sum;ctx.fillStyle=COL[o].m;ctx.fillRect(x,py,w+1,ph);x+=w}
 ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(px,py+4,pw,(ph-8)*.45);ctx.restore();
 ctx.font='900 20px system-ui,-apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.lineWidth=4;ctx.lineJoin='round';ctx.strokeStyle='rgba(20,40,80,.55)';ctx.strokeText(`LEVEL ${lvlIdx+1}`,W/2,py+ph/2+1);
 ctx.fillStyle='#fff';ctx.fillText(`LEVEL ${lvlIdx+1}`,W/2,py+ph/2+1);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function drawHint(){
 let msg=null,from=null,to=null;
 if(lvlIdx===0&&!madeLink){msg='Drag from your blue tower to another tower';from=towers.find(t=>t.owner===1);to=towers.find(t=>t.owner===0)}

 if(!msg)return;

  ctx.globalAlpha=k<.8?1:1-(k-.8)/.2;ctx.fillStyle='rgba(255,255,255,.9)';ell(x,y,TR*.32,TR*.32);ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,TR*.5,0,7);ctx.stroke();ctx.globalAlpha=1}
 ctx.font='800 16px system-ui,-apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
 const tw=ctx.measureText(msg).width+30;ctx.fillStyle='rgba(0,0,0,.55)';rr(W/2-tw/2,H-52,tw,36,18);ctx.fill();
 ctx.fillStyle='#fff';ctx.fillText(msg,W/2,H-34);

function draw(){
 ctx.drawImage(bg,0,0,W,H);
 if(state==='menu'){menuScene();return}
 for(const t of towers)if(t.type==='p'){const r=archRange(t);
  ctx.fillStyle=t.owner===0?'rgba(255,255,255,.06)':hexA(COL[t.owner].m,.07);ctx.beginPath();ctx.ellipse(t.x,t.y,r,r*RY,0,0,7);ctx.fill();
  ctx.strokeStyle=t.owner===0?'rgba(255,255,255,.55)':'rgba(255,255,255,.9)';ctx.lineWidth=3;ctx.stroke()}
 for(const l of links)drawLink(l);
 if(drag&&drag.from){const A=pa(drag.from);const B=drag.over?pa(drag.over):drag.p;
  ctx.strokeStyle=drag.bad?'rgba(255,80,80,.9)':'rgba(255,255,255,.9)';ctx.lineWidth=TR*.12;ctx.lineCap='round';ctx.setLineDash([TR*.25,TR*.2]);ctx.lineDashOffset=-time*40;
  ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,.9)';ell(B.x,B.y,TR*.2,TR*.2)}
 const items=towers.map(t=>[t.y,0,t]).concat(units.map(u=>[u.y,1,u]));items.sort((a,b)=>a[0]-b[0]);
 for(const[,k,o]of items)k?drawUnit(o):drawTower(o);
 for(const a of arrows){const tx=a.tg.x,ty=a.tg.y-TR*.9,k=a.k;
  const x=a.sx+(tx-a.sx)*k,y=a.sy+(ty-a.sy)*k-Math.sin(k*Math.PI)*TR*2.2;
  const k2=Math.min(1,k+.03),x2=a.sx+(tx-a.sx)*k2,y2=a.sy+(ty-a.sy)*k2-Math.sin(k2*Math.PI)*TR*2.2;
  const ang=Math.atan2(y2-y,x2-x),L=TR*.55;ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.strokeStyle='#6b4423';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-L/2,0);ctx.lineTo(L/2,0);ctx.stroke();
  ctx.fillStyle='#4a4f57';ctx.beginPath();ctx.moveTo(L/2+5,0);ctx.lineTo(L/2-1,-3);ctx.lineTo(L/2-1,3);ctx.fill();
  ctx.fillStyle=COL[a.o].m;ctx.fillRect(-L/2-1,-3,5,6);ctx.restore()}
 for(const t of towers)drawBadge(t);
 for(const r of rings){ctx.strokeStyle=hexA(r.c,Math.max(0,r.life/.6));ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*.4,0,0,7);ctx.stroke()}
 for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;ell(p.x,p.y,p.s,p.s)}ctx.globalAlpha=1;
 if(cutTrail.length>1){ctx.lineCap='round';ctx.lineJoin='round';
  for(const[w,c]of[[TR*.3,'rgba(255,240,180,.35)'],[TR*.1,'#fff']]){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();cutTrail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}}
 drawHUD();drawHint();
}

// ---------- input ----------
function towerAt(p,R=1.3){let best=null,bd=1e9;for(const t of towers){const c={x:t.x,y:t.y-TR*.9};const d=Math.hypot(p.x-c.x,p.y-c.y);if(d<TR*R&&d<bd){bd=d;best=t}}return best}
function segInt(p,p2,a,b){const r={x:p2.x-p.x,y:p2.y-p.y},s={x:b.x-a.x,y:b.y-a.y};const den=r.x*s.y-r.y*s.x;if(Math.abs(den)<1e-6)return-1;
 const qp={x:a.x-p.x,y:a.y-p.y};const t=(qp.x*s.y-qp.y*s.x)/den,u=(qp.x*r.y-qp.y*r.x)/den;return(t>=0&&t<=1&&u>=0&&u<=1)?u:-1}
const pos=e=>({x:e.clientX,y:e.clientY});
cv.addEventListener('pointerdown',e=>{
 if(state!=='play')return;cv.setPointerCapture(e.pointerId);const p=pos(e);
 const t=towerAt(p);
 if(t&&t.owner===1&&t.type!=='p')drag={from:t,p,over:null};else if(t&&t.owner===1)drag=null;else{drag={cut:true,last:p};cutTrail=[p]}
});
cv.addEventListener('pointermove',e=>{
 if(!drag||state!=='play')return;const p=pos(e);
 if(drag.from){drag.p=p;const t=towerAt(p,1.5);drag.over=t&&t!==drag.from?t:null;drag.bad=!!(drag.over&&blocked(drag.from,drag.over))}
 else{
  for(const l of links.slice()){if(l.owner!==1)continue;const s=segInt(drag.last,p,pa(l.from),pa(l.to));if(s>=0){removeLink(l,s);spark(drag.last.x,drag.last.y,'#fff',5)}}
  drag.last=p;cutTrail.push(p);if(cutTrail.length>14)cutTrail.shift();
 }
});
const up=()=>{
 if(drag&&drag.from&&drag.over&&drag.from.owner===1){if(createLink(drag.from,drag.over,1)&&!madeLink){madeLink=true;if(lvlIdx===0)hint2=5}}
 drag=null;setTimeout(()=>{if(!drag)cutTrail=[]},120);
};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

// ---------- UI ----------
function buildGrid(){const g=$('grid');g.innerHTML='';LEVELS.forEach((L,i)=>{const b=document.createElement('button');b.className='lv'+(i+1<unlocked?' done':'')+(i>=unlocked?' locked':'');b.textContent=i+1;b.onclick=()=>{if(i<unlocked)loadLevel(i)};g.appendChild(b)})}
function toMenu(){state='menu';walls=[];towers=[];buildBG();for(const id of['pause','win','lose'])$(id).classList.add('hidden');$('pauseBtn').classList.add('hidden');buildGrid();$('menu').classList.remove('hidden')}
$('playBtn').onclick=()=>loadLevel(Math.min(unlocked,LEVELS.length)-1);
$('pauseBtn').onclick=()=>{if(state==='play'){state='paused';$('pause').classList.remove('hidden')}};
$('resumeBtn').onclick=()=>{state='play';$('pause').classList.add('hidden')};
$('restartBtn').onclick=()=>loadLevel(lvlIdx);
$('retryBtn').onclick=()=>loadLevel(lvlIdx);
$('nextBtn').onclick=()=>loadLevel(lvlIdx<LEVELS.length-1?lvlIdx+1:0);
for(const id of['menuBtn1','menuBtn2','menuBtn3'])$(id).onclick=toMenu;

addEventListener('resize',resize);
resize();buildGrid();
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
