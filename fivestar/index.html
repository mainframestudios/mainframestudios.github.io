<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Five Star">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2b4bf2">
<title>Five Star Street</title>
<link rel="icon" href="icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly, loud, a little street-market
   IDEA: a high street of shopfronts; every company gets an awning
   PICTURE: the storefront grid itself, awnings striped in each company's colour
   COLOUR/TYPE: cobalt band, white ground, sunshine stars; Archivo Black + Archivo
   LAYOUT: band with title + add button, toolbar, storefront grid, bottom sheet for details */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1330);--card:light-dark(#ffffff,#171d45);--ink:light-dark(#14172b,#f2f3ff);--mute:light-dark(#5b6080,#a9aed6);--line:light-dark(#e3e5f0,#2a3166);--blue:#2b4bf2;--star:#ffc21a;--soft:light-dark(#f2f4ff,#1c2352)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Archivo,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Archivo Black",Archivo,sans-serif;font-weight:400;margin:0;line-height:1.05;text-wrap:balance}
.top{background:linear-gradient(180deg,#1a2fc4 0%,var(--blue) 60%,#4d68ff 100%);color:#fff;position:relative;overflow:hidden}
.hero{position:relative;z-index:1;max-width:1240px;margin:auto;padding:calc(clamp(28px,5vw,56px) + env(safe-area-inset-top)) max(5vw,16px,env(safe-area-inset-left)) 0;display:grid;gap:14px}
.top h1{font-size:clamp(36px,7vw,60px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1 .st{color:var(--star);font-size:.8em;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.top p{margin:0;opacity:.92;max-width:44ch;font-size:17px}
.hrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:6px}
.hrow .btn{min-height:52px;padding:0 24px;font-size:17px;box-shadow:0 4px 0 #c9940a}
.hrow .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #c9940a}
.counts{display:flex;gap:10px;flex-wrap:wrap}
.counts span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap}
.counts b{font-size:16px}
.street{display:block;width:100%;height:clamp(110px,16vw,170px);margin-top:18px}
.road{height:14px;background:#14172b;border-top:4px solid #ffd85a}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 max(5vw,16px) 14px;scrollbar-width:none}
.chips button{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:15px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:0;background:var(--star);color:#14172b;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:transparent;color:#e0344b;padding:0 8px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.shop:focus-visible{outline:3px solid var(--star);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px;padding:18px max(5vw,16px) 12px}
.bar input,.bar select{min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card)}
.bar input{flex:1 1 220px}
.note{margin:0;padding:12px max(5vw,16px);background:var(--soft);color:var(--ink);font-size:15px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:20px;padding:24px max(5vw,16px) 60px;max-width:1240px;margin:auto}
.shop{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;box-shadow:0 6px 18px -12px rgba(20,23,60,.35);transition:transform .15s}
.shop:hover{transform:translateY(-3px)}
.awn{height:34px;background:repeating-linear-gradient(90deg,var(--c) 0 26px,#fff 26px 52px);position:relative}
.awn::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:radial-gradient(circle at 13px 0,var(--c) 12px,transparent 13px) 0 0/26px 10px repeat-x}
.sbody{padding:22px 16px 16px;display:grid;gap:8px}
.logo{width:52px;height:52px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font:22px "Archivo Black";box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.shop h3{font-size:20px}
.lrow{display:flex;align-items:center;gap:14px}
.rbadge{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.rbadge b{font:30px/1 "Archivo Black";color:var(--ink)}
.rbadge .stars{font-size:18px}
.cat{font-size:13px;color:var(--mute)}
.tag{color:var(--mute);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stars{color:var(--star);letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line)}
.meta{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute);flex-wrap:wrap}
.meta b{color:var(--ink);font-size:16px}
.empty{grid-column:1/-1;text-align:center;padding:60px 16px;color:var(--mute)}
.empty h2{color:var(--ink);font-size:28px;margin-bottom:8px}
.veil{position:fixed;inset:0;background:rgba(8,10,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
.veil.on{display:flex}
.sheet{background:var(--bg);width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(32px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@media(min-width:700px){.veil{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}.shop{transition:none}}
.shead{display:flex;gap:14px;align-items:center;justify-content:space-between}
.shead h2{font-size:clamp(26px,5vw,34px)}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;font-size:22px;flex:none}
label{display:block;font-weight:600;margin:14px 0 6px}
.f input,.f select,.f textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
textarea{resize:vertical;min-height:90px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:12px;border:3px solid transparent;cursor:pointer}
.sw[aria-pressed=true]{border-color:var(--ink)}
.big{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:18px 0;padding:16px;background:var(--soft);border-radius:16px}
.avg{font:52px/1 "Archivo Black"}
.dist{flex:1 1 200px;display:grid;gap:4px;font-size:13px}
.dr{display:grid;grid-template-columns:2.2em 1fr 2em;gap:8px;align-items:center}
.dr i{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:block}
.dr i span{display:block;height:100%;background:var(--star)}
.dr em{font-style:normal;text-align:right;color:var(--mute)}
.pick{display:flex;gap:4px}
.pick button{width:48px;height:48px;border:0;background:none;font-size:34px;cursor:pointer;color:var(--line);padding:0}
.pick button.on{color:var(--star)}
.rev{border-top:1px solid var(--line);padding:14px 0}
.rev .who{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700}
.rev .when{font-weight:400;color:var(--mute);font-size:13px}
.rev p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.err{color:#e0344b;font-size:14px;margin:8px 0 0}
.by{color:var(--mute);font-size:14px;margin:6px 0 0}
.acct{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3)}
.tabs-unused{display:flex;gap:8px;margin-top:14px}.tabs button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
</style>
</head>
<body>
<header class="top">
  <div class="hero">
    <h1>Five Star Street <span class="st">★★★★★</span></h1>
    <p>Put your company on the street. Everyone else can stop by, rate it and leave a review.</p>
    <div class="hrow"><button class="btn" id="addBtn">+ Add your company</button><button class="btn ghost acct" id="acctBtn">Set your name</button><div class="counts"><span><b id="nC">0</b> companies</span><span><b id="nR">0</b> reviews</span></div></div>
  </div>
  <svg class="street" id="street" viewBox="0 0 1200 170" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
  <div class="road"></div>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="Search companies" aria-label="Search companies">
  <select id="sort" aria-label="Sort"><option value="top">Top rated</option><option value="new">Newest</option><option value="most">Most reviews</option><option value="az">A to Z</option></select>
</div>
<div class="chips" id="chips"></div>
<p class="note" id="status">Loading the street…</p>
<main class="grid" id="grid"></main>

<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyCLGQt79zzs08XUgrzFmFlbcBfMU-wqkz8",
  authDomain:"mainframe-hq-5097a.firebaseapp.com",
  projectId:"mainframe-hq-5097a",
  storageBucket:"mainframe-hq-5097a.firebasestorage.app",
  messagingSenderId:"922166206069",
  appId:"1:922166206069:web:25009e5830bd74a58f623c"
});
const fdb=getFirestore(app);
const CO="fss_companies", RV="fss_reviews";

const COLORS=['#2b4bf2','#e0344b','#ff7a1a','#0aa5a5','#8a3ffc','#14172b','#d6248f','#1f9d55'];
const CATS=['Food & drink','Games','Tech','Shop','Services','Creative','Sports','Other'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let me=LS.get('fss_id');if(!me){me='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);LS.set('fss_id',me)}
let catF='All',myName=LS.get('fss_name')||'',companies=[],reviews=[],openId=null,draft={stars:0},addColor=COLORS[0],afterSignIn=null,authMode='in';

/* street drawing */
{
  const out=[];let x=-20,i=0;const pal=['#ff7a1a','#e0344b','#ffc21a','#0aa5a5','#8a3ffc','#d6248f','#ffffff'];
  while(x<1220){
    const w=110+(i*37%60),h=90+(i*53%70),c=pal[i%pal.length],y=170-h,body=i%2?'#e9ecff':'#cfd6ff';
    out.push(`<g><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${body}"/><rect x="${x}" y="${y}" width="${w}" height="8" fill="#14172b" opacity=".15"/><rect x="${x+12}" y="${y+18}" width="${w-24}" height="16" rx="3" fill="#14172b"/><circle cx="${x+w/2}" cy="${y+26}" r="4" fill="#ffc21a"/>`
      +[...Array(Math.floor(w/26))].map((_,k)=>`<rect x="${x+k*26}" y="${y+42}" width="13" height="18" fill="${c}"/><rect x="${x+k*26+13}" y="${y+42}" width="13" height="18" fill="#fff"/>`).join('')
      +`<rect x="${x+12}" y="${y+66}" width="${w*0.45}" height="${h-66}" fill="#7fc8ff" opacity=".9"/><rect x="${x+w*0.62}" y="${y+66}" width="${w*0.26}" height="${h-66}" rx="3" fill="#14172b" opacity=".75"/></g>`);
    x+=w+6;i++;
  }
  const stars=[...Array(14)].map((_,k)=>`<text x="${(k*97+40)%1200}" y="${20+(k*41%60)}" font-size="${10+k%3*5}" fill="#ffc21a" opacity=".55">★</text>`).join('');
  $('#street').innerHTML=stars+out.join('');
}

const errMsg=e=>{const c=e?.code||'';return({
  'permission-denied':'The database said no (permission-denied).',
  'auth/invalid-email':'That email doesn’t look right.',
  'auth/invalid-credential':'Wrong email or password.',
  'auth/wrong-password':'Wrong password.',
  'auth/user-not-found':'No account with that email. Tap “New account”.',
  'auth/email-already-in-use':'That email already has an account. Tap “Sign in”.',
  'auth/weak-password':'Password needs at least 6 characters.',
  'auth/too-many-requests':'Too many tries. Wait a minute and try again.',
  'auth/network-request-failed':'No internet connection.'
})[c]||('Something went wrong ('+(c||e?.message||'unknown')+').')};

const starStr=n=>{const r=Math.round(n);return '<span class="stars" aria-label="'+n.toFixed(1)+' stars">'+'★'.repeat(r)+'<span class="off">'+'★'.repeat(5-r)+'</span></span>'};
const stats=id=>{const rs=reviews.filter(r=>r.company===id);const avg=rs.length?rs.reduce((a,r)=>a+(+r.stars||0),0)/rs.length:0;return{rs,avg,n:rs.length}};
const ago=t=>{const s=(Date.now()-t)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'};
const nm=(id,n)=>id&&id===me?'You':(n||'Someone');
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

function render(){
  const q=$('#q').value.trim().toLowerCase(),sort=$('#sort').value;
  $('#nC').textContent=companies.length;$('#nR').textContent=reviews.filter(r=>companies.some(c=>c.id===r.company)).length;
  $('#chips').innerHTML=['All',...CATS].map(c=>`<button data-cat="${c}" aria-pressed="${c===catF}">${c}</button>`).join('');
  let list=companies.filter(c=>catF==='All'||(c.cat||'Other')===catF).filter(c=>!q||(c.name+' '+(c.tagline||'')+' '+(c.cat||'')).toLowerCase().includes(q)).map(c=>({...c,...stats(c.id)}));
  list.sort({top:(a,b)=>b.avg-a.avg||b.n-a.n,new:(a,b)=>(b.at||0)-(a.at||0),most:(a,b)=>b.n-a.n,az:(a,b)=>a.name.localeCompare(b.name)}[sort]);
  $('#grid').innerHTML=list.length?list.map(c=>`
    <button class="shop" data-id="${esc(c.id)}" style="--c:${esc(c.color||COLORS[0])}">
      <div class="awn"></div>
      <div class="sbody">
        <div class="lrow"><div class="logo">${esc(initials(c.name))}</div><div class="rbadge">${c.n?`<b>${c.avg.toFixed(1)}</b>${starStr(c.avg)}`:'<span class="cat">No rating yet</span>'}</div></div>
        <h3>${esc(c.name)}</h3>
        <div class="cat">${esc(c.cat||'Other')}</div>
        <div class="tag">${esc(c.tagline||'')}</div>
        <div class="meta">${c.n?`<span>${c.n} review${c.n>1?'s':''}</span>`:'<span>No reviews yet — be first</span>'}</div>
      </div>
    </button>`).join(''):`<div class="empty"><h2>${q?'Nothing matches that':'The street is empty'}</h2><p>${q?'Try another search.':'Add your company and it shows up here for everyone.'}</p></div>`;
  if(openId)renderDetail();
}

function openSheet(html){$('#sheet').innerHTML=html;$('#veil').classList.add('on');$('#sheet').querySelector('input,button')?.focus()}
function closeSheet(){$('#veil').classList.remove('on');openId=null}
const needSignIn=then=>{if(myName)return false;afterSignIn=then;renderAuth();return true};

function renderAuth(){
  openId=null;
  openSheet(`<div class="shead"><h2>What’s your name?</h2><button class="x" data-close aria-label="Close">×</button></div>
  <p class="by">This shows on your reviews and companies.</p>
  <form class="f" id="authForm">
    <label for="an">Your name</label><input id="an" maxlength="30" required autocomplete="nickname" value="${esc(myName)}" placeholder="Your name">
    <div class="row"><button class="btn" type="submit">Save</button></div>
    <p class="err" id="authErr"></p>
  </form>`);
}

function renderAdd(){
  openSheet(`<div class="shead"><h2>Add your company</h2><button class="x" data-close aria-label="Close">×</button></div>
  <form class="f" id="addForm">
    <label for="cn">Company name</label><input id="cn" maxlength="40" required placeholder="Mainframe Studios">
    <label for="ct">What do you do?</label><input id="ct" maxlength="120" placeholder="We make free games on the web">
    <label for="cc">Category</label><select id="cc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
    <label>Colour</label><div class="swatches">${COLORS.map(c=>`<button type="button" class="sw" data-sw="${c}" style="background:${c}" aria-label="Colour ${c}" aria-pressed="${c===addColor}"></button>`).join('')}</div>
    <div class="row"><button class="btn" type="submit">Put it on the street</button><button class="btn ghost" type="button" data-close>Cancel</button></div>
    <p class="err" id="addErr"></p>
  </form>`);
}

function renderDetail(){
  const c=companies.find(x=>x.id===openId);if(!c){closeSheet();return}
  const {rs,avg,n}=stats(c.id);const mine=rs.find(r=>r.by===me);
  if(draft.for!==c.id){draft={for:c.id,stars:mine?.stars||0,text:mine?.text||''}}
  const dist=[5,4,3,2,1].map(s=>{const k=rs.filter(r=>+r.stars===s).length;return`<div class="dr"><span>${s}★</span><i><span style="width:${n?k/n*100:0}%"></span></i><em>${k}</em></div>`}).join('');
  const others=rs.filter(r=>r.by!==me).sort((a,b)=>(b.at||0)-(a.at||0));
  const focusedText=document.activeElement?.id==='rt';
  $('#sheet').innerHTML=`<div class="shead" style="--c:${esc(c.color)}"><div style="display:flex;gap:12px;align-items:center"><div class="logo">${esc(initials(c.name))}</div><h2>${esc(c.name)}</h2></div><button class="x" data-close aria-label="Close">×</button></div>
  <p class="by">${esc(c.cat||'Other')} · added by ${esc(nm(c.by,c.byName))}</p>
  ${c.tagline?`<p>${esc(c.tagline)}</p>`:''}
  <div class="big"><div><div class="avg">${n?avg.toFixed(1):'–'}</div>${starStr(avg)}<div class="cat">${n} review${n===1?'':'s'}</div></div><div class="dist">${dist}</div></div>
  ${me&&c.by===me?'<p class="by">This is your company, so you can’t rate it. Send people the link so they can.</p>':`
  <h3 style="font-size:22px">${mine?'Your review':'Rate it'}</h3>
  <div class="pick" role="radiogroup" aria-label="Stars">${[1,2,3,4,5].map(s=>`<button type="button" data-star="${s}" class="${s<=draft.stars?'on':''}" aria-label="${s} star${s>1?'s':''}" aria-checked="${s===draft.stars}" role="radio">★</button>`).join('')}</div>
  <div class="f"><label for="rt">Review <span class="cat">(optional)</span></label><textarea id="rt" maxlength="500" placeholder="What was it like?">${esc(draft.text)}</textarea></div>
  <div class="row"><button class="btn" id="saveRev">${mine?'Update review':'Post review'}</button>${mine?'<button class="btn danger" id="delRev">Delete my review</button>':''}</div>
  <p class="err" id="revErr"></p>`}
  <div style="margin-top:22px">${others.length?others.map(r=>`<div class="rev"><div class="who"><span>${esc(r.byName||'Someone')}</span>${starStr(+r.stars)}</div><div class="when">${ago(r.at||Date.now())}</div>${r.text?`<p>${esc(r.text)}</p>`:''}</div>`).join(''):'<p class="cat">No reviews from other people yet.</p>'}</div>
  ${me&&c.by===me?`<div class="row"><button class="btn danger" id="delCo">Take my company off the street</button></div>`:''}`;
  if(focusedText){const t=$('#rt');t?.focus();t?.setSelectionRange(t.value.length,t.value.length)}
}

async function saveReview(){
  const btn=$('#saveRev');draft.text=($('#rt')?.value||'').trim();
  if(!draft.stars){$('#revErr').textContent='Pick 1 to 5 stars first.';return}
  btn.disabled=true;
  try{await setDoc(doc(fdb,RV,openId+'_'+me),{company:openId,by:me,byName:myName,stars:draft.stars,text:draft.text.slice(0,500),at:Date.now()});$('#revErr').textContent='Posted!'}
  catch(e){$('#revErr').textContent='Couldn’t save: '+errMsg(e);btn.disabled=false}
}

document.addEventListener('click',async e=>{
  const t=e.target;
  if(t.closest('[data-close]')||t.id==='veil'){closeSheet();return}
  const md=t.closest('[data-mode]');if(md){authMode=md.dataset.mode;renderAuth();return}
  const ch=t.closest('[data-cat]');if(ch){catF=ch.dataset.cat;render();return}
  const shop=t.closest('.shop');if(shop){openId=shop.dataset.id;draft={};openSheet('');renderDetail();return}
  if(t.id==='acctBtn'){afterSignIn=null;renderAuth();return}
  if(t.id==='addBtn'){if(needSignIn(()=>renderAdd()))return;renderAdd();return}
  const sw=t.closest('[data-sw]');if(sw){addColor=sw.dataset.sw;document.querySelectorAll('[data-sw]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.sw===addColor));return}
  const st=t.closest('[data-star]');if(st){draft.text=$('#rt')?.value||'';draft.stars=+st.dataset.star;renderDetail();return}
  if(t.id==='saveRev'){
    if(!myName){draft.text=($('#rt')?.value||'');const id=openId,d={...draft};needSignIn(()=>{openId=id;draft=d;openSheet('');renderDetail()});return}
    saveReview();return}
  if(t.id==='delRev'){try{await deleteDoc(doc(fdb,RV,openId+'_'+me));draft={for:openId,stars:0,text:''}}catch(err){$('#revErr').textContent='Couldn’t delete: '+errMsg(err)}return}
  if(t.id==='delCo'){
    if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Tap again to confirm';return}
    const id=openId;closeSheet();
    try{await deleteDoc(doc(fdb,CO,id))}catch(err){$('#status').textContent='Couldn’t remove it: '+errMsg(err)}
  }
});

document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='authForm'){
    const name=$('#an').value.trim().slice(0,30);if(!name){$('#authErr').textContent='Type your name.';return}
    myName=name;LS.set('fss_name',name);acct();setStatus();render();
    closeSheet();const f=afterSignIn;afterSignIn=null;if(f)setTimeout(f,50);
    return}
  if(e.target.id==='addForm'){
    const name=$('#cn').value.trim();if(!name){$('#addErr').textContent='Give it a name.';return}
    const id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    try{await setDoc(doc(fdb,CO,id),{name:name.slice(0,40),tagline:$('#ct').value.trim().slice(0,120),cat:$('#cc').value,color:addColor,by:me,byName:myName,at:Date.now()});closeSheet()}
    catch(err){$('#addErr').textContent='Couldn’t add it: '+errMsg(err)}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('#q').addEventListener('input',render);$('#sort').addEventListener('change',render);

const setStatus=()=>{$('#status').textContent=myName?`Hi ${myName}! Tap a company to rate it — one review per person, post again to update.`:'Tap a company to rate it or add your own. No account needed.'};
const acct=()=>{$('#acctBtn').textContent=myName?('Name: '+myName):'Set your name'};
acct();setStatus();
render();
let got=0;const timer=setTimeout(()=>{if(got<2)$('#status').textContent='The street is taking a while to load. Check your connection and reload.'},10000);
const loaded=()=>{if(++got===2){clearTimeout(timer);setStatus()}};
const failed=e=>{clearTimeout(timer);$('#status').textContent='Couldn’t load the street: '+errMsg(e)};
onSnapshot(collection(fdb,CO),s=>{companies=s.docs.map(d=>({...d.data(),id:d.id})).filter(c=>c.name);render();loaded()},failed);
onSnapshot(collection(fdb,RV),s=>{reviews=s.docs.map(d=>({...d.data(),id:d.id})).filter(r=>r.company);render();loaded()},failed);
</script>
</body>
</html>
